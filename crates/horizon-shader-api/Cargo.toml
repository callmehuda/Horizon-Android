[package]
name = "horizon-shader-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Horizon's own shader packs (WGSL, docs/shaders.md): the format, the stages, the check, and the horizon-shader tool"

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
# Parses and validates a pack's WGSL, and translates it as wgpu does for Vulkan, Metal and DirectX 12.
png = "0.18"
# glsl-out: the GLSL ES writer, as the GLES backend of wgpu runs it (3.0 up to 3.2).
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "msl-out", "hlsl-out", "glsl-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.6"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
# glsl-in: builds glsl-in-only modules in the tests (the interpolator fix).
naga = { version = "30.0.1", features = ["glsl-in"] }

[lints]
workspace = true
